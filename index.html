  function animateCount(){
    var el = document.getElementById('totalNum');
    if(!el) return;
    var target = parseInt(el.getAttribute('data-target'), 10);
    var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(reduced){ el.textContent = 'R$' + target; return; }

    var duration = 700;
    var startTime = null;
    function tick(now){
      if(startTime === null) startTime = now;
      var p = Math.min((now - startTime) / duration, 1);
      el.textContent = 'R$' + Math.floor(p * target);
      if(p < 1) requestAnimationFrame(tick);
      else el.textContent = 'R$' + target;
    }
    requestAnimationFrame(tick);
  }

  // 📊 Envia a etapa alcançada + UTMs da campanha pra sua planilha (Apps Script)
  function trackEvent(step){
    if(!TRACKING_ENDPOINT || TRACKING_ENDPOINT.indexOf('COLE_AQUI') > -1) return;

    var payload = {
      session_id: sessionId,
      step: step,
      ts: new Date().toISOString(),
      utm_source: utms.utm_source,
      utm_medium: utms.utm_medium,
      utm_campaign: utms.utm_campaign,
      utm_content: utms.utm_content,
      utm_term: utms.utm_term
    };

    fetch(TRACKING_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    }).catch(function(){ /* falha de rede não deve travar o quiz */ });
  }

  function stepEventName(step){
    if(step.type === 'landing') return 'quiz_start';
    if(step.type === 'question') return 'quiz_' + step.key;
    if(step.type === 'confirm') return 'quiz_confirm';
    if(step.type === 'result') return 'quiz_result_view';
    if(step.type === 'video') return 'quiz_video_view';
    return null;
  }

  function render(){
    var stage = document.getElementById('stage');
    if (!stage) return;
    var step = STEPS[current];
    var html = '';

    if(step.type === 'landing') html = renderLanding();
    else if(step.type === 'question') html = renderQuestion(step);
    else if(step.type === 'confirm') html = renderConfirm();
    else if(step.type === 'loading') html = renderLoading();
    else if(step.type === 'result') html = renderResult();
    else if(step.type === 'video') html = renderVideo();

    stage.innerHTML = html;
    stage.classList.remove('anim');
    void stage.offsetWidth;
    stage.classList.add('anim');

    renderTopbar();

    document.body.classList.toggle('center-screen', step.type === 'video'); document.body.classList.toggle('is-landing', step.type === 'landing');

    var evtName = stepEventName(step);
    if(evtName) trackEvent(evtName);

    if(step.type === 'loading'){
      setTimeout(function(){ current++; render(); }, 1500);
    }
    if(step.type === 'result'){
      animateCount();
    }
    if(step.type === 'video'){
      setTimeout(function(){
        var cta = document.getElementById('cta-button');
        if(cta) cta.style.display = 'flex';
        var img = document.getElementById('cta-image');
        if(img) img.style.display = 'block';
      }, 100000);
    }
  }

  var stageEl = document.getElementById('stage');
  if (stageEl) {
    stageEl.addEventListener('click', function(e){
      var optBtn = e.target.closest('.option');
    if(optBtn){
      var step = STEPS[current];
      answers[step.key] = optBtn.getAttribute('data-value');
      current++;
      render();
      return;
    }
    var actionEl = e.target.closest('[data-action]');
    if(actionEl){
      var action = actionEl.getAttribute('data-action');
      if(action === 'start' || action === 'confirm' || action === 'show-video'){
        current++;
        render();
      }
      if(action === 'cta'){
        trackEvent('quiz_cta_click');

      }

    }
